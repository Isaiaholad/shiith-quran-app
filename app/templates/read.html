{% extends "base.html" %}

{% block title %}Read Quran{% endblock %}

{% block content %}
<div class="reading-container">
    <div class="container">
        <!-- Surah Selector -->
        <div class="surah-selector">
            <div class="selector-header">
                <h2>Select Surah</h2>
                <button class="btn-icon" id="toggleSurahList">
                    <i class="fas fa-list"></i>
                </button>
            </div>

            <div class="selector-controls">
                <select id="surahSelect" class="form-select">
                    <option value="">Loading Surahs...</option>
                </select>

                <div class="verse-navigation">
                    <button class="btn-icon" id="prevBtn" title="Previous verse">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <input type="number" id="verseNumber" min="1" placeholder="Verse #" class="verse-input">
                    <button class="btn-icon" id="nextBtn" title="Next verse">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <button class="btn-icon" id="jumpBtn" title="Jump to verse">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Reading Controls -->
        <div class="reading-controls">
            <div class="control-group">
                <button class="btn btn-secondary" id="playAllBtn">
                    <i class="fas fa-play"></i> Play Surah
                </button>
                <button class="btn btn-secondary" id="stopAudioBtn" style="display: none;">
                    <i class="fas fa-stop"></i> Stop
                </button>
            </div>

            <div class="control-group">
                <label for="translationToggle">
                    <input type="checkbox" id="translationToggle" checked>
                    Show Translation
                </label>
                <label for="arabicOnlyToggle">
                    <input type="checkbox" id="arabicOnlyToggle">
                    Arabic Only
                </label>
            </div>
        </div>

        <!-- Verses Display -->
        <div class="verses-container" id="versesContainer">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading verses...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination" style="display: none;">
            <button class="btn btn-secondary" id="loadMoreBtn">
                <i class="fas fa-arrow-down"></i> Load More Verses
            </button>
        </div>
    </div>
</div>

<!-- Verse Actions Modal -->
<div class="modal" id="verseActionsModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Verse Actions</h3>
            <button class="btn-close" data-close="verseActionsModal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="verse-preview" id="versePreview"></div>
            <div class="action-buttons">
                <button class="btn btn-primary" id="copyVerseBtn">
                    <i class="fas fa-copy"></i> Copy Verse
                </button>
                <button class="btn btn-primary" id="shareVerseBtn">
                    <i class="fas fa-share"></i> Share
                </button>
                <button class="btn btn-primary" id="bookmarkVerseBtn">
                    <i class="fas fa-bookmark"></i> Bookmark
                </button>
                <button class="btn btn-primary" id="playVerseAudioBtn">
                    <i class="fas fa-play"></i> Play Audio
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Audio Player (Hidden) -->
<audio id="audioPlayer" preload="none"></audio>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/read.js') }}"></script>
{% endblock %}
